name: Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build All Modules with Maven
        run: |
          for pom in $(find Projects -name "pom.xml"); do
            mvn clean package -DskipTests -f "$pom"
          done
          
      - name: Run Trivy FS Scan (SAST)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'Projects'
          format: 'table'
          exit-code: '0'
